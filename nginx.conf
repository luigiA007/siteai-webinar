server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Coolify's proxy terminates HTTPS in front of this container.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;          # demos and the brief load in same-site frames
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "noindex, nofollow" always;      # webinar site: keep it out of search

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;
  gzip_min_length 1024;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location ~* \.(jpg|jpeg|png|webp|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ $uri.html =404;
  }

  location ~ /(README\.md|_build/) { return 404; }
}
